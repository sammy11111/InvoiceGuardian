[project]
name = "invoiceguardian"
version = "0.1.0"
description = "InvoiceGuardian — Service Invoice Exception Review"
authors = [
    { name = "Sammy Ibrahim", email = "sammy_ibraham@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.9",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pyright>=1.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
